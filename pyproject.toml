[project]
name = "thingsapp"
version = "0.1.0"
description = "Python library and CLI for Things.app on macOS"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "things.py>=0.0.15",
]
license = "MIT"
authors = [{ name = "Nelson Love" }]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
]

[project.scripts]
things = "things_app.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["things_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
